<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusSpace - İnteraktif Pomodoro ve Çalışma Alanı</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['Space Mono', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="theme-zen h-full flex flex-col justify-between font-sans antialiased overflow-x-hidden select-none">
    
<header class="w-full max-w-6xl mx-auto px-6 pt-6 flex items-center justify-between z-20">
    <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-sky-500/20 border border-sky-400/30 flex items-center justify-center text-sky-400 text-xl font-bold">
            <i class="fa-solid fa-brain"></i>
        </div>
        <div>
            <h1 class="text-xl font-extrabold tracking-tight">FocusSpace</h1>
            <p class="text-xs text-gray-400">Kişiselleştirilebilir Odaklanma</p>
        </div>
    </div>

    <div class="flex items-center space-x-3">
        <div class="glass-panel px-3.5 py-1.5 rounded-full flex items-center space-x-2 text-sm text-amber-300 border border-amber-500/20">
            <i class="fa-solid fa-fire text-amber-400"></i>
            <span id="streak-count" class="font-bold">1</span> Gün
        </div>

        <div class="glass-panel px-3.5 py-1.5 rounded-full flex items-center space-x-2 text-sm text-emerald-300 border-emerald-500/20">
            <i class="fa-solid fa-stopwatch text-emerald-400"></i>
            <span id="total-focus-mins" class="font-bold">0</span> dk Bugün
        </div>

        <button id="themen-btn" onclick="cycleTheme()" class="glass-panel w-10 h-10 rounded-xl flex items-center justify-center hover:bg-white/10 transition-colors text-gray-400 hover:text-gray-900" title="Tema Değiştir">
            <i class="fa-solid fa-palette text-lg"></i>
        </button>

        <button onclick="openSettingsModal()" class="glass-panel w-10 h-10 rounded-xl flex items-center justify-center hover:bg-white/20 transition-colors text-gray-400 hover:text-gray-900" title="Tema Değiştir">
            <i class="fa-solid fa-sliders text-lg"></i>
        </button>

        <button onclick="toggleFullScreen()" class="glass-panel w-10 h-10 rounded-xl flex items-center justify-center hover:bg-white/10 transition-colors text-gray-400 hover:text-gray-900" title="Tam Ekran">
            <i class="fa-solid fa-expand text-lg"></i>
        </button>
    </div>
</header>

<main class="w-full max-w-6xl mx-auto px-6 py-6 flex-1 grid grid-cols-1 lg:grid-cols-12 gap-8 items-center z-10">

    <section class="lg:col-span-7 flex flex-col items-center justify-center space-y-8">
        <div class="glass-panel p-1.5 rounded-2xl flex space-x-1 border border-white/10 shadow-lg">
            <button id="mode-focus" onclick="switchMode('focus')" class="px-5 py-2.5 rounded-xl text-sm font-semibold transition-all duration-300 bg-sky-500/20 text-sky-300 border border-sky-400/30 shadow-sm shadow-sky-500/10">
                <i class="fa-solid fa-bullseye mr-2"></i>Odaklanma
            </button>
            <button id="mode-shortBreak" onclick="switchMode('shortBreak')" class="px-5 py-2.5 rounded-xl text-sm font-semibold text-gray-500 hover:text-gray-700 hover:bg-white/5 transition-all duration-300">
                <i class="fa-solid fa-mug-hot mr-2"></i>Kısa Mola
            </button>
            <button id="mode-longBreak" onclick="switchMode('longBreak')" class="px-5 py-2.5 rounded-xl text-sm font-semibold text-gray-500 hover:text-gray-700 hover:bg-white/5 transition-all duration-300">
                <i class="fa-solid fa-couch mr-2"></i>Uzun Mola
            </button>
        </div>

        <div class="relative flex items-center justify-center">
            <svg class="w-72 h-72 md:w-80 md:h-80 drop-shadow-2xl" viewBox="0 0 240 240">
                <circle cx="120" cy="120" r="102" stroke="currentColor" stroke-width="8" class="text-white/5" fill="none"></circle>
                <circle id="progress-circle" class="progress-ring-circle text-sky-400" stroke-linecap="round" cx="120" cy="120" r="102" stroke="currentColor" stroke-width="8" stroke-dasharray="640.88" stroke-dashoffset="0" fill="none"></circle>
            </svg>
            <div class="absolute inset-0 flex flex-col items-center justify-center text-center space-y-2">
                <span id="timer-display" class="font-mono text-6xl md:text-7xl font-bold tracking-tight text-gray-700 drop-shadow-lg">25:00</span>
                <p id="active-task-label" class="text-xs text-sky-300/80 max-w-[180px] truncate px-3 py-1 rounded-full bg-white/5 border border-white/5">
                    <i class="fa-regular fa-bookmark mr-1"></i> Görev seçilmedi
                </p>
            </div>
        </div>

        <div class="flex items-center space-x4">
            <button id="reset-btn" onclick="resetTimer()" class="glass-panel w-12 h-12 rounded-2xl flex items-center justify-center text-gray-400 hover:text-gray-700 hover:bg-white/10 active:scale-95 transition-all" title="Sıfırla">
                <i class="fa-solid fa-rotate-right text-lg"></i>
            </button>

            <button id="play-btn" onclick="toggleTimer()" class="glass-panel glow-effect px-8 py-4 rounded-2xl flex items-center space-x-3 bg-sky-500 text-slate-950 font-extrabold text-lg hover:bg-sky-400 active:scale-95 transition-all shadow-xl">
                <i id="play-icon" class="fa-solid fa-play"></i>
                <span id="play-text">Başlat</span>
            </button>

            <button id="skip-btn" onclick="skipSession()" class="glass-panel w-12 h-12 rounded-2xl flex items-center justify-center text-gray-400 hover:text-gray-700 hover:bg-white/10 active:scale-95 transition-all" title="Atla">
                <i class="fa-solid fa-forward text-lg"></i>
            </button>
        </div>

        <div class="flex items-center space-x-3 text-xs text-gray-400">
            <span>Hızlı Ayar:</span>
            <button onclick="addTime(-5)" class="px-2.5 py-1 rounded-lg glass-panel hover:bg-white/5 hover:text-gray-700 transition-colors">-5 dk</button>
            <button onclick="addTime(5)" class="px-2.5 py-1 rounded-lg glass-panel hover:bg-white/5 hover:text-gray-700 transition-colors">+5 dk</button>
            <button onclick="addTime(10)" class="px-2.5 py-1 rounded-lg glass-panel hover:bg-white/5 hover:text-gray-700 transition-colors">+10 dk</button>
        </div>
    </section>

    <section class="lg:col-span-5 flex flex-col space-y-6">
        <div class="glass-panel p-5 rounded-3xl space-y-4">
            <div class="flex items-center justify-between border-b border-white/10 pb-3">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-list-check text-sky-400"></i>
                    <h2 class="font-bold text-sm tracking-wide">Görev Takibi</h2>
                </div>
                <span id="completed-task-count" class="text-xs text-gray-400">0/0 Tamamlandı</span>
            </div>

            <form id="add-task-form" onsubmit="handleAddTask(event)" class="flex space-x-2">
                <input type="text" id="task-input" placeholder="Bugün ne üzerine çalışacaksın?" class="flex-1 bg-black/10 border border-white/10 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-sky-400/50 transition-colors">
                <button type="submit" class="bg-sky-500/20 hover:bg-sky-500/30 text-sky-300 border border-sky-400/30 px-4 rounded-xl text-sm font-semibold transition-colors">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </form>

            <div id="task-list" class="space-y-2 max-h-48 overflow-y-auto pr-1">
                <p id="empty-tasks-msg" class="text-center text-xs text-gray-500 py-4">Henüz görev eklenmedi.</p>
            </div>
        </div>

        
    </section>
</main>

</body>
</html>
