<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusSpace - İnteraktif Pomodoro ve Çalışma Alanı</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['Space Mono', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="theme-zen h-full flex flex-col justify-between font-sans antialiased overflow-x-hidden select-none">
    
<header class="w-full max-w-6xl mx-auto px-6 pt-6 flex items-center justify-between z-20">
    <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-sky-500/20 border border-sky-400/30 flex items-center justify-center text-sky-400 text-xl font-bold">
            <i class="fa-solid fa-brain"></i>
        </div>
        <div>
            <h1 class="text-xl font-extrabold tracking-tight">FocusSpace</h1>
            <p class="text-xs text-gray-400">Kişiselleştirilebilir Odaklanma</p>
        </div>
    </div>

    <div class="flex items-center space-x-3">
        <div class="glass-panel px-3.5 py-1.5 rounded-full flex items-center space-x-2 text-sm text-amber-300 border border-amber-500/20">
            <i class="fa-solid fa-fire text-amber-400"></i>
            <span id="streak-count" class="font-bold">1</span> Gün
        </div>

        <div class="glass-panel px-3.5 py-1.5 rounded-full flex items-center space-x-2 text-sm text-emerald-300 border-emerald-500/20">
            <i class="fa-solid fa-stopwatch text-emerald-400"></i>
            <span id="total-focus-mins" class="font-bold">0</span> dk Bugün
        </div>

        <button id="themen-btn" onclick="cycleTheme()" class="glass-panel w-10 h-10 rounded-xl flex items-center justify-center hover:bg-white/10 transition-colors text-gray-400 hover:text-gray-900" title="Tema Değiştir">
            <i class="fa-solid fa-palette text-lg"></i>
        </button>

        <button onclick="openSettingsModal()" class="glass-panel w-10 h-10 rounded-xl flex items-center justify-center hover:bg-white/20 transition-colors text-gray-400 hover:text-gray-900" title="Tema Değiştir">
            <i class="fa-solid fa-sliders text-lg"></i>
        </button>

        <button onclick="toggleFullScreen()" class="glass-panel w-10 h-10 rounded-xl flex items-center justify-center hover:bg-white/10 transition-colors text-gray-400 hover:text-gray-900" title="Tam Ekran">
            <i class="fa-solid fa-expand text-lg"></i>
        </button>
    </div>
</header>

<main class="w-full max-w-6xl mx-auto px-6 py-6 flex-1 grid grid-cols-1 lg:grid-cols-12 gap-8 items-center z-10">

    <section class="lg:col-span-7 flex flex-col items-center justify-center space-y-8">
        <div class="glass-panel p-1.5 rounded-2xl flex space-x-1 border border-white/10 shadow-lg">
            <button id="mode-focus" onclick="switchMode('focus')" class="px-5 py-2.5 rounded-xl text-sm font-semibold transition-all duration-300 bg-sky-500/20 text-sky-300 border border-sky-400/30 shadow-sm shadow-sky-500/10">
                <i class="fa-solid fa-bullseye mr-2"></i>Odaklanma
            </button>
            <button id="mode-shortBreak" onclick="switchMode('shortBreak')" class="px-5 py-2.5 rounded-xl text-sm font-semibold text-gray-500 hover:text-gray-700 hover:bg-white/5 transition-all duration-300">
                <i class="fa-solid fa-mug-hot mr-2"></i>Kısa Mola
            </button>
            <button id="mode-longBreak" onclick="switchMode('longBreak')" class="px-5 py-2.5 rounded-xl text-sm font-semibold text-gray-500 hover:text-gray-700 hover:bg-white/5 transition-all duration-300">
                <i class="fa-solid fa-couch mr-2"></i>Uzun Mola
            </button>
        </div>
    </section>

</main>

</body>
</html>
